<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAFE DE MEMORIES</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, "Noto Sans Thai", sans-serif;
    background: linear-gradient(135deg, #eef4ff, #f7f7f7);
    color: #222;
  }
  .card {
    width: min(92%, 520px);
    padding: 42px 24px;
    text-align: center;
    background: white;
    border-radius: 24px;
    box-shadow: 0 10px 35px rgba(0,0,0,.12);
  }
  .icon { font-size: 64px; margin-bottom: 8px; }
  h1 {
    margin: 0 0 12px;
    font-size: clamp(28px, 8vw, 42px);
    letter-spacing: .5px;
  }
  .subtitle {
    margin: 8px 0;
    font-size: 21px;
    line-height: 1.6;
  }
  .rule {
    display: inline-block;
    margin: 16px 0 28px;
    padding: 10px 16px;
    border-radius: 12px;
    background: #f0f5ff;
    font-weight: bold;
    font-size: 18px;
  }
  button {
    width: 100%;
    max-width: 360px;
    padding: 18px 24px;
    border: 0;
    border-radius: 16px;
    background: #1a73e8;
    color: white;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(26,115,232,.25);
  }
  button:active { transform: scale(.98); }
  .note {
    margin-top: 20px;
    font-size: 14px;
    color: #666;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="card">
  <div class="icon">🎮</div>
  <h1>CAFE DE MEMORIES</h1>
  <div class="subtitle">การแข่งขันตอบคำถาม</div>
  <div class="rule">ตอบถูก + ใช้เวลาน้อยที่สุด</div>

  <button type="button" onclick="startGame()">
    🟢 เริ่มการแข่งขัน
  </button>

  <div class="note">
    เมื่อกดเริ่ม ระบบจะบันทึกเวลาเริ่มการแข่งขันโดยอัตโนมัติ
  </div>
</div>

<script>
function startGame() {
  const startTime = Date.now();

  const formUrl =
    "https://docs.google.com/forms/d/e/1FAIpQLScI4yMDCskKApo2oruZe3HTrjTd8A3RIaqJcdeBe_ZA4AhXOw/viewform" +
    "?usp=pp_url" +
    "&entry.297441290=" +
    encodeURIComponent(startTime);

  window.location.href = formUrl;
}
</script>

</body>
</html>
